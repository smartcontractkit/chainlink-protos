syntax = "proto3";

package chainlink_ccv.committee_verifier.v1;

option go_package = "github.com/smartcontractkit/chainlink-protos/chainlink-ccv/committee-verifier/v1";

// CommitteeVerifierStatus is a public read-only API that shows the quorum progress of a message.
service CommitteeVerifierStatus {
  rpc GetMessageStatus(GetMessageStatusRequest) returns (GetMessageStatusResponse);
}

message GetMessageStatusRequest {
  // The message ID. It must be exactly 32 bytes.
  bytes message_id = 1;
}

message GetMessageStatusResponse {
  bytes message_id = 1;
  // The number of committee signers that verified the message. It can be more than the threshold.
  uint32 verification_count = 2;
  // The number of signers that is necessary for the quorum.
  uint32 threshold = 3;
  // True when the aggregator has an aggregated report for the message.
  bool aggregated = 4;
}
